<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131A22">
<meta name="description" content="Start/sit calls for Sleeper fantasy football leagues, built from sportsbook betting lines.">
<meta name="robots" content="noindex, nofollow">
<title>Sharp Start</title>
</head>
<body>
<title>Sharp Start</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Public+Sans:wght@400;600;700&display=swap">
<style>
:root {
  --bg: #F4F6F8; --card: #FFFFFF; --card2: #EDF0F4; --card3: #E4E9EF;
  --ink: #1A222C; --muted: #4E5A68; --faint: #7E8996; --line: #DDE3EA;
  --rec: #2E6FB7; --alt: #C56A1A;
  --rec-soft: rgba(46,111,183,.12); --alt-soft: rgba(197,106,26,.12);
  --good: #1E7B4F; --good-soft: rgba(30,123,79,.12);
  --bad: #A33B2E; --bad-soft: rgba(163,59,46,.12);
  --warn: #8A6116; --warn-soft: rgba(178,131,29,.14);
  --tight: #7A5EA8; --tight-soft: rgba(122,94,168,.13);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131A22; --card: #1B242F; --card2: #212C39; --card3: #2A3644;
    --ink: #E7ECF2; --muted: #A5B1BF; --faint: #75828F; --line: #2B3644;
    --rec: #5C97D6; --alt: #C77722;
    --rec-soft: rgba(92,151,214,.16); --alt-soft: rgba(199,119,34,.16);
    --good: #4CAF7E; --good-soft: rgba(76,175,126,.15);
    --bad: #D4796B; --bad-soft: rgba(212,121,107,.15);
    --warn: #D2A24C; --warn-soft: rgba(210,162,76,.16);
    --tight: #A78BD4; --tight-soft: rgba(167,139,212,.16);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131A22; --card: #1B242F; --card2: #212C39; --card3: #2A3644;
  --ink: #E7ECF2; --muted: #A5B1BF; --faint: #75828F; --line: #2B3644;
  --rec: #5C97D6; --alt: #C77722;
  --rec-soft: rgba(92,151,214,.16); --alt-soft: rgba(199,119,34,.16);
  --good: #4CAF7E; --good-soft: rgba(76,175,126,.15);
  --bad: #D4796B; --bad-soft: rgba(212,121,107,.15);
  --warn: #D2A24C; --warn-soft: rgba(210,162,76,.16);
  --tight: #A78BD4; --tight-soft: rgba(167,139,212,.16);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 "Public Sans", system-ui, -apple-system, sans-serif;
  font-variant-numeric: tabular-nums; overflow: hidden;
}
.top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 16px 0; border-bottom: 1px solid var(--line); }
.brand-row { display: flex; align-items: baseline; gap: 10px; }
.brand { font-family: "Barlow Semi Condensed", "Arial Narrow", sans-serif; font-weight: 700; font-size: 22px; letter-spacing: .04em; display: flex; align-items: center; gap: 7px; }
.brand small { color: var(--muted); font-weight: 600; font-size: 13px; letter-spacing: .1em; }
.mark { width: 24px; height: 24px; flex: 0 0 auto; display: block; }
.pulled { margin-left: auto; color: var(--faint); font-size: 11px; text-align: right; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 0 0 auto; border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 999px; padding: 5px 12px; font: 600 12.5px "Public Sans", sans-serif; cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.tab:focus-visible { outline: 2px solid var(--rec); outline-offset: 2px; }

.deck { display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; height: calc(100dvh - 74px); scrollbar-width: none; }
.deck::-webkit-scrollbar { display: none; }
.panel { flex: 0 0 100%; scroll-snap-align: start; overflow-y: auto; padding: 16px 16px 56px; }
.panel-inner { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

h2.sec { margin: 0; font-family: "Barlow Semi Condensed", sans-serif; font-weight: 700; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.pill { border-radius: 999px; padding: 2px 9px; font-size: 11px; font-weight: 700; font-family: "Public Sans", sans-serif; letter-spacing: 0; text-transform: none; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.tight { background: var(--tight-soft); color: var(--tight); }
.pill.clear { background: var(--card2); color: var(--muted); }
.inj { font-size: 9.5px; font-weight: 700; border-radius: 4px; padding: 1px 5px; background: var(--warn-soft); color: var(--warn); }
.inj.out { background: var(--bad-soft); color: var(--bad); }

/* overview */
.ov-hello { font-family: "Barlow Semi Condensed", sans-serif; font-weight: 700; font-size: 26px; line-height: 1.1; text-wrap: balance; }
.ov-sub { color: var(--muted); font-size: 13px; }
.ov-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; }
.ov-card:focus-visible { outline: 2px solid var(--rec); }
.ov-top { display: flex; align-items: center; gap: 10px; }
.ov-name { font-weight: 700; font-size: 15px; flex: 1; min-width: 0; }
.ov-wp { font-family: "Barlow Semi Condensed", sans-serif; font-weight: 700; font-size: 22px; }
.ov-wp small { font-size: 12px; color: var(--muted); font-weight: 600; }
.ov-line { color: var(--muted); font-size: 12.5px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ov-line b { color: var(--ink); }
.hint { background: var(--card2); border: 1px dashed var(--line); border-radius: 12px; padding: 12px 14px; font-size: 12.5px; color: var(--muted); position: relative; }
.hint b { color: var(--ink); }
.hint button { position: absolute; top: 6px; right: 8px; border: 0; background: none; color: var(--faint); font-size: 16px; cursor: pointer; padding: 4px; }
.xchips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--card2); color: var(--muted); font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 3px 10px; }
.chip.stack { background: var(--rec-soft); color: var(--rec); }

/* league hero */
.lg-name { font-family: "Barlow Semi Condensed", sans-serif; font-weight: 700; font-size: 24px; line-height: 1.15; text-wrap: balance; }
.lg-meta { color: var(--muted); font-size: 12.5px; }
.matchbar { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; gap: 16px; }
.winprob { text-align: center; min-width: 92px; }
.winprob .n { font-family: "Barlow Semi Condensed", sans-serif; font-weight: 700; font-size: 38px; line-height: 1; }
.winprob .delta { font-size: 11.5px; color: var(--good); font-weight: 700; }
.winprob .l { color: var(--muted); font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; margin-top: 2px; }
.totals { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.tot-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
.tot-row .who { width: 34px; color: var(--muted); font-weight: 600; font-size: 11px; letter-spacing: .06em; }
.tot-row .val { width: 44px; text-align: right; font-weight: 700; }
.tot-track { flex: 1; height: 8px; background: var(--card2); border-radius: 4px; overflow: hidden; }
.tot-fill { height: 100%; border-radius: 4px; background: var(--ink); }
.tot-row.opp .tot-fill { background: var(--faint); }

/* changes */
.swap { background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--good); border-radius: 12px; padding: 11px 14px; display: flex; align-items: center; gap: 12px; }
.swap .arrows { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
.swap .in, .swap .outp { display: flex; align-items: center; gap: 7px; font-size: 13.5px; white-space: nowrap; overflow: hidden; }
.swap .in b, .swap .outp b { overflow: hidden; text-overflow: ellipsis; }
.swap .dir { font-size: 10px; font-weight: 700; letter-spacing: .07em; width: 30px; flex: 0 0 auto; }
.swap .in .dir { color: var(--good); } .swap .outp .dir { color: var(--bad); }
.swap .pj { margin-left: auto; font-weight: 700; }
.swap .gain { text-align: center; flex: 0 0 auto; }
.swap .gain .n { font-family: "Barlow Semi Condensed", sans-serif; font-weight: 700; font-size: 19px; color: var(--good); }
.swap .gain .l { font-size: 9.5px; color: var(--muted); letter-spacing: .06em; }

/* lineup */
.lineup { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.lrow { display: grid; grid-template-columns: 42px 1fr 84px 44px; gap: 8px; align-items: center; padding: 9px 12px; border-top: 1px solid var(--line); }
.lrow:first-child { border-top: 0; }
.lrow.dim { opacity: .6; }
.pos { font: 700 10.5px "Barlow Semi Condensed", sans-serif; letter-spacing: .04em; color: var(--muted); background: var(--card2); border-radius: 5px; text-align: center; padding: 3px 2px; }
.pos.flex { background: var(--rec-soft); color: var(--rec); }
.pname { min-width: 0; }
.pname .nm { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
.pname .sub { color: var(--faint); font-size: 11px; }
.tag { font-size: 9.5px; font-weight: 700; letter-spacing: .06em; border-radius: 4px; padding: 1px 5px; flex: 0 0 auto; }
.tag.start { background: var(--good-soft); color: var(--good); }
.tag.sit { background: var(--bad-soft); color: var(--bad); }
.tag.locked { background: var(--card3); color: var(--faint); }
.range { position: relative; height: 6px; background: var(--card2); border-radius: 3px; }
.range .band { position: absolute; top: 0; bottom: 0; background: var(--rec-soft); border-radius: 3px; }
.range .dot { position: absolute; top: 50%; width: 8px; height: 8px; border-radius: 50%; background: var(--rec); transform: translate(-50%, -50%); border: 2px solid var(--card); }
.proj { text-align: right; font-weight: 700; font-size: 14px; }
.nomkt { color: var(--faint); font-size: 11.5px; padding: 8px 12px; border-top: 1px solid var(--line); }
.lrow { cursor: pointer; }
.lrow:focus-visible { outline: 2px solid var(--rec); outline-offset: -2px; }
.warnflag { font-size: 9.5px; font-weight: 700; border-radius: 4px; padding: 1px 5px; background: var(--warn-soft); color: var(--warn); flex: 0 0 auto; }
.lexp { border-top: 1px dashed var(--line); background: var(--card2); padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.lexp[hidden] { display: none; }
.lexp svg { display: block; width: 100%; height: auto; }
.qcap { font-size: 10.5px; color: var(--faint); letter-spacing: .05em; text-transform: uppercase; }
.qtiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.qt { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 7px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.qt .qp { font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
.qt .qv { font-family: "Barlow Semi Condensed", sans-serif; font-weight: 700; font-size: 18px; line-height: 1; }
.qt .qv small { font-size: 11px; color: var(--faint); font-weight: 600; }
.qt .qrow { display: flex; align-items: center; gap: 5px; font-weight: 700; font-size: 14px; font-family: "Barlow Semi Condensed", sans-serif; }
.qt .qrow .sw { width: 7px; height: 7px; border-radius: 2px; flex: 0 0 auto; }
.locknote { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; background: var(--warn-soft); color: var(--ink); border-radius: 8px; padding: 8px 11px; }
.locknote .ic { color: var(--warn); font-weight: 700; }
.linesrow { display: flex; flex-wrap: wrap; gap: 6px; font-size: 11px; }
.linechip { border-radius: 6px; padding: 2px 8px; background: var(--card); border: 1px solid var(--line); color: var(--muted); }
.linechip b { color: var(--ink); }
.linechip.miss { border-color: var(--warn); color: var(--warn); }
.lexp .src { font-size: 10.5px; color: var(--faint); }

/* decision cards */
.dec { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 12px; }
.dec.is-tight { border-color: var(--tight); box-shadow: 0 0 0 1px var(--tight); }
.dec.is-change { border-color: var(--good); box-shadow: 0 0 0 1px var(--good); }
.ladnote { font-size: 10.5px; font-weight: 700; border-radius: 4px; padding: 1px 6px; flex: 0 0 auto; }
.ladnote.ok { background: var(--good-soft); color: var(--good); }
.ladnote.warn { background: var(--warn-soft); color: var(--warn); }
.dec-head { display: flex; align-items: center; gap: 8px; }
.dec-head .slot { font: 700 11px "Barlow Semi Condensed", sans-serif; letter-spacing: .06em; color: var(--muted); }
.dec-verdict { margin-left: auto; }
.duel { display: flex; flex-direction: column; gap: 10px; }
.duelist { display: flex; flex-direction: column; gap: 5px; }
.d-top { display: flex; align-items: baseline; gap: 8px; }
.d-top .sw { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; align-self: center; }
.duelist.rec .sw { background: var(--rec); } .duelist.altp .sw { background: var(--alt); }
.d-top .nm { font-weight: 700; font-size: 14.5px; }
.d-top .meta { color: var(--muted); font-size: 11.5px; }
.d-top .pj { margin-left: auto; font-family: "Barlow Semi Condensed", sans-serif; font-weight: 700; font-size: 20px; }
.d-top .pj small { font-size: 10px; color: var(--muted); font-weight: 600; letter-spacing: .05em; }
.frange { display: grid; grid-template-columns: 58px 1fr 58px; gap: 8px; align-items: center; font-size: 11px; }
.frange .fv { color: var(--muted); } .frange .cv { color: var(--muted); text-align: right; }
.frange .fv b, .frange .cv b { color: var(--ink); font-size: 12px; }
.ftrack { position: relative; height: 8px; background: var(--card2); border-radius: 4px; }
.ftrack .band { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
.duelist.rec .band { background: var(--rec-soft); border: 1px solid var(--rec); }
.duelist.altp .band { background: var(--alt-soft); border: 1px solid var(--alt); }
.ftrack .dot { position: absolute; top: 50%; width: 9px; height: 9px; border-radius: 50%; transform: translate(-50%, -50%); border: 2px solid var(--card); }
.duelist.rec .dot { background: var(--rec); } .duelist.altp .dot { background: var(--alt); }
figure.curves { margin: 0; }
figure.curves figcaption { font-size: 10.5px; color: var(--faint); letter-spacing: .05em; text-transform: uppercase; margin-bottom: 2px; }
figure.curves svg { display: block; width: 100%; height: auto; touch-action: pan-y; }
.simbar { display: flex; flex-direction: column; gap: 4px; }
.simbar .l { font-size: 10.5px; color: var(--faint); letter-spacing: .05em; text-transform: uppercase; }
.simbar .bar { display: flex; height: 22px; border-radius: 6px; overflow: hidden; gap: 2px; }
.simbar .seg { display: flex; align-items: center; padding: 0 8px; font-size: 11px; font-weight: 700; color: #fff; min-width: 0; white-space: nowrap; }
.simbar .seg.r { background: var(--rec); } .simbar .seg.a { background: var(--alt); justify-content: flex-end; }
.takeaway { font-size: 13px; background: var(--card2); border-radius: 8px; padding: 9px 12px; }
.takeaway b { font-weight: 700; }
.stats { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); }
.stats b { color: var(--ink); font-weight: 700; }
details.why { border-top: 1px solid var(--line); padding-top: 8px; }
details.why summary { cursor: pointer; color: var(--muted); font-size: 12px; font-weight: 600; list-style: none; display: flex; align-items: center; gap: 6px; }
details.why summary::before { content: "▸"; font-size: 10px; transition: transform .15s; }
details.why[open] summary::before { transform: rotate(90deg); }
details.why .expl { font-size: 13px; margin: 8px 0 6px; }
.pc { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 12px; }
.pc ul { margin: 4px 0 0; padding-left: 16px; color: var(--muted); }
.pc .h { font-weight: 700; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; }
.pc .h.r { color: var(--rec); } .pc .h.a { color: var(--alt); }
.more { border: 1px dashed var(--line); border-radius: 12px; }
.more > summary { cursor: pointer; padding: 10px 14px; color: var(--muted); font-weight: 600; font-size: 12.5px; list-style: none; }
.more > summary::marker { content: ""; }
.more[open] > summary { border-bottom: 1px solid var(--line); }
.more .inner { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.empty { color: var(--muted); font-size: 13px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }

.health { color: var(--faint); font-size: 11.5px; line-height: 1.6; border-top: 1px solid var(--line); padding-top: 12px; }
/* entry screen */
/* No align-items here: `margin: auto` on the child centres it when there is
   room and lets it scroll from the top when there is not, which align-items
   would clip on a short screen (keyboard open, landscape). */
.gate { position: fixed; inset: 0; background: var(--bg); display: flex; justify-content: center; padding: 24px; overflow-y: auto; z-index: 20; }
.gate[hidden] { display: none; }
.gate-inner { width: 100%; max-width: 380px; margin: auto; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
.gate-mark { width: 46px; height: 46px; }
.gate-h { font-family: "Barlow Semi Condensed", sans-serif; font-weight: 700; font-size: 34px; margin: 2px 0 0; letter-spacing: .01em; }
.gate-p { color: var(--muted); font-size: 13.5px; margin: 0; line-height: 1.55; }
.gate form { width: 100%; display: flex; flex-direction: column; gap: 7px; margin-top: 6px; }
.gate-l { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.gate-i { width: 100%; font: 16px "Public Sans", sans-serif; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
.gate-i:focus { outline: 2px solid var(--rec); outline-offset: 1px; border-color: var(--rec); }
.gate-b { font: 700 15px "Public Sans", sans-serif; padding: 12px; border-radius: 10px; border: 0; background: var(--rec); color: #fff; cursor: pointer; }
.gate-b:disabled { opacity: .55; cursor: default; }
.gate-err { font-size: 12.5px; color: var(--bad); background: var(--bad-soft); border-radius: 8px; padding: 8px 11px; }
.gate-err[hidden] { display: none; }
.gate-status { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--muted); margin-top: 4px; }
.gate-status[hidden] { display: none; }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--rec); animation: sp .7s linear infinite; flex: 0 0 auto; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.5s; } }
.gate-foot { font-size: 11.5px; color: var(--faint); margin: 6px 0 0; line-height: 1.6; }
.gate-pick { width: 100%; display: flex; flex-direction: column; gap: 7px; }
.pickrow { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; }
.pickrow input { width: 17px; height: 17px; accent-color: var(--rec); flex: 0 0 auto; }
.pickrow label { flex: 1; min-width: 0; cursor: pointer; }
.acct { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--faint); }
.acct button { border: 0; background: none; color: var(--rec); font: 600 11px "Public Sans", sans-serif; cursor: pointer; padding: 2px 4px; text-decoration: underline; }
.dots { position: fixed; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 6px; pointer-events: none; }
.dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); opacity: .4; transition: opacity .15s, transform .15s; }
.dots span.on { opacity: 1; transform: scale(1.3); background: var(--ink); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

<header class="top">
  <div class="brand-row">
    <div class="brand">
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
        <defs><linearGradient id="mk" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="var(--rec)" stop-opacity=".55"/>
          <stop offset="1" stop-color="var(--rec)" stop-opacity=".12"/>
        </linearGradient></defs>
        <path d="M1,20 C6,20 7,3.5 12,3.5 C17,3.5 18,20 23,20 L23,21 L1,21 Z" fill="url(#mk)"/>
        <path d="M1,20 C6,20 7,3.5 12,3.5 C17,3.5 18,20 23,20" fill="none" stroke="var(--rec)" stroke-width="2" stroke-linecap="round"/>
        <line x1="17.2" y1="1.6" x2="17.2" y2="22.4" stroke="var(--alt)" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      SHARP START <small id="wk"></small></div>
    <div class="pulled" id="pulled"></div>
  </div>

<script>
// Home-screen identity. Injected into <head> at runtime because the artifact
// wrapper owns the document head — iOS reads these when you Add to Home Screen.
try {
  const ICONS = JSON.parse(document.getElementById('icons').textContent);
  const head = document.head;
  const add = (tag, attrs) => { const el = document.createElement(tag); for (const k in attrs) el.setAttribute(k, attrs[k]); head.appendChild(el); };
  // The artifact wrapper supplies charset + viewport; a self-hosted copy of
  // this file has neither, and without the viewport a phone lays the page out
  // at 980px and zooms out.
  if (!head.querySelector('meta[name="viewport"]'))
    add('meta', { name: 'viewport', content: 'width=device-width, initial-scale=1, viewport-fit=cover' });
  if (!head.querySelector('meta[charset]')) {
    const mc = document.createElement('meta'); mc.setAttribute('charset', 'utf-8'); head.prepend(mc);
  }
  if (ICONS.icon180) {
    add('link', { rel: 'apple-touch-icon', sizes: '180x180', href: ICONS.icon180 });
    add('link', { rel: 'apple-touch-icon-precomposed', href: ICONS.icon180 });
  }
  if (ICONS.icon512) add('link', { rel: 'icon', type: 'image/png', sizes: '512x512', href: ICONS.icon512 });
  add('meta', { name: 'apple-mobile-web-app-title', content: 'Sharp Start' });
  add('meta', { name: 'application-name', content: 'Sharp Start' });
  add('meta', { name: 'apple-mobile-web-app-capable', content: 'yes' });
  add('meta', { name: 'apple-mobile-web-app-status-bar-style', content: 'black-translucent' });
  add('meta', { name: 'theme-color', content: '#131A22' });
} catch (e) { /* icons are cosmetic — never block the report */ }

<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f1 = (n) => n.toFixed(1);
const first = (name) => name.split(' ')[0];
const surname = (name) => name.split(' ').slice(1).join(' ') || name;
const shortName = (n) => n.length > 16 ? first(n)[0] + '. ' + surname(n) : n;
const koLabel = (iso) => iso ? new Date(iso).toLocaleString('en-GB', { weekday: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/London' }).replace(',', '') : '';
const injBadge = (inj) => inj ? `<span class="inj${/Out|IR|PUP|Sus/.test(inj) ? ' out' : ''}">${inj === 'Questionable' ? 'Q' : inj === 'Doubtful' ? 'D' : esc(inj)}</span>` : '';

const pulled = new Date(DATA.sharpRefreshedAt ?? DATA.pulledAt);
const ageDays = (Date.now() - pulled.getTime()) / 864e5;
const stamp = (iso) => { const d = new Date(iso); return d.toLocaleDateString('en-GB', { weekday: 'short' }) + ' ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); };
document.getElementById('pulled').innerHTML =
  (DATA.sharpRefreshedAt ? 'sharp lines ' + stamp(DATA.sharpRefreshedAt) + '<br>ladders ' + stamp(DATA.pulledAt) : 'odds ' + stamp(DATA.pulledAt)) +
  (ageDays > 3 ? '<br><span style="color:var(--warn)">lines may have moved</span>' : '');

// ---- curves ----
function curveSvg(dec) {
  const W = 360, H = 128, padL = 8, padR = 8, padT = 18, padB = 20;
  const xMax = Math.max(...dec.rec.curve.x, ...dec.alt.curve.x);
  const yMax = Math.max(...dec.rec.curve.y, ...dec.alt.curve.y) * 1.08;
  const X = (v) => padL + (v / xMax) * (W - padL - padR);
  const Y = (v) => H - padB - (v / yMax) * (H - padT - padB);
  const path = (c, close) => {
    let d = 'M' + X(c.x[0]).toFixed(1) + ',' + Y(c.y[0]).toFixed(1);
    for (let i = 1; i < c.x.length; i++) d += 'L' + X(c.x[i]).toFixed(1) + ',' + Y(c.y[i]).toFixed(1);
    if (close) d += 'L' + X(c.x[c.x.length - 1]).toFixed(1) + ',' + (H - padB) + 'L' + X(c.x[0]).toFixed(1) + ',' + (H - padB) + 'Z';
    return d;
  };
  const yAt = (c, x) => {
    let best = 0, bd = 1e9;
    for (let i = 0; i < c.x.length; i++) { const d = Math.abs(c.x[i] - x); if (d < bd) { bd = d; best = i; } }
    return c.y[best];
  };
  const step = xMax > 45 ? 10 : 5;
  let ticks = '';
  for (let t = 0; t <= xMax; t += step) {
    ticks += `<line x1="${X(t).toFixed(1)}" y1="${H - padB}" x2="${X(t).toFixed(1)}" y2="${H - padB + 3}" stroke="var(--line)"/>`;
    if (X(t) < W - 58) ticks += `<text x="${X(t).toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="9" fill="var(--faint)">${t}</text>`;
  }
  const mean = (side, cls) =>
    `<line x1="${X(side.proj).toFixed(1)}" y1="${Y(yAt(side.curve, side.proj)).toFixed(1)}" x2="${X(side.proj).toFixed(1)}" y2="${H - padB}" stroke="var(--${cls})" stroke-width="1.5" stroke-dasharray="1.5 2.5"/>`;
  let cross = '';
  if (dec.crossover !== null && dec.crossover > 0 && dec.crossover < xMax) {
    const cx = X(dec.crossover).toFixed(1);
    cross = `<line x1="${cx}" y1="${padT - 4}" x2="${cx}" y2="${H - padB}" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 3"/>` +
      `<text x="${cx}" y="${padT - 7}" text-anchor="middle" font-size="9" fill="var(--muted)">crossover ${f1(dec.crossover)}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Projected points distributions for ${esc(dec.rec.name)} and ${esc(dec.alt.name)}" data-xmax="${xMax.toFixed(1)}">
    <line x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}" stroke="var(--line)"/>
    ${ticks}
    <path d="${path(dec.alt.curve, true)}" fill="var(--alt-soft)"/>
    <path d="${path(dec.rec.curve, true)}" fill="var(--rec-soft)"/>
    <path d="${path(dec.alt.curve, false)}" fill="none" stroke="var(--alt)" stroke-width="2"/>
    <path d="${path(dec.rec.curve, false)}" fill="none" stroke="var(--rec)" stroke-width="2"/>
    ${mean(dec.rec, 'rec')}${mean(dec.alt, 'alt')}
    ${cross}
    <g class="xh" hidden>
      <line y1="${padT}" y2="${H - padB}" stroke="var(--muted)" stroke-width="1"/>
      <text y="${padT + 8}" font-size="9.5" font-weight="700" fill="var(--ink)"></text>
    </g>
    <text x="${W - padR}" y="${H - 6}" text-anchor="end" font-size="9" fill="var(--faint)">fantasy pts</text>
  </svg>`;
}

function takeaway(dec) {
  const rec = shortName(dec.rec.name), alt = shortName(dec.alt.name);
  const pAlt = dec.pOutscores;
  if (dec.verdict === 'suppressed')
    return `<b>Effectively a coin flip.</b> ${rec} vs ${alt} is a ${f1(dec.gap)}-point gap with ${pAlt}% of sims going ${alt}'s way — the swap is marginal, either is fine. Late team news should decide it.`;
  if (dec.verdict === 'close_call') {
    let t = `<b>Genuinely close.</b> ${rec} projects ${f1(dec.gap)} higher, but ${alt} lifts your win chance by ${f1(dec.swingPp)}pp this week.`;
    if (dec.crossover !== null) t += ` Need a big score? Above ~${f1(dec.crossover)} pts, ${alt} is the likelier one to get there.`;
    return t;
  }
  let t = `<b>Start ${rec}.</b> ${alt} outscores him in only ${pAlt}% of simulations`;
  if (dec.crossover !== null) t += `, and only pulls ahead above ~${f1(dec.crossover)} pts`;
  return t + '.';
}

const STAT_NAME = { rec_yd: 'rec yds', rush_yd: 'rush yds', rec: 'receptions', pass_yd: 'pass yds', pass_td: 'pass TDs' };
function qStrip(quantiles, caption) {
  return `${caption ? `<div class="qcap">${caption}</div>` : ''}<div class="qtiles">
    ${quantiles.map(([p, v]) => `<div class="qt"><span class="qp">${p}% ≥</span><span class="qv">${f1(v)}<small> pts</small></span></div>`).join('')}
  </div>`;
}
function miniCurve(p) {
  const W = 360, H = 76, padL = 8, padR = 8, padT = 14, padB = 16;
  const xMax = Math.max(...p.curve.x, p.ceil * 1.05);
  const yMax = Math.max(...p.curve.y) * 1.1;
  const X = (v) => padL + (v / xMax) * (W - padL - padR);
  const Y = (v) => H - padB - (v / yMax) * (H - padT - padB);
  let d = 'M' + X(p.curve.x[0]).toFixed(1) + ',' + Y(p.curve.y[0]).toFixed(1);
  for (let i = 1; i < p.curve.x.length; i++) d += 'L' + X(p.curve.x[i]).toFixed(1) + ',' + Y(p.curve.y[i]).toFixed(1);
  const dc = d + `L${X(p.curve.x[p.curve.x.length - 1]).toFixed(1)},${H - padB}L${X(p.curve.x[0]).toFixed(1)},${H - padB}Z`;
  const step = xMax > 45 ? 10 : 5;
  let ticks = '';
  for (let t = 0; t <= xMax; t += step)
    ticks += `<text x="${X(t).toFixed(1)}" y="${H - 4}" text-anchor="middle" font-size="8.5" fill="var(--faint)">${t}</text>`;
  const proj = `<line x1="${X(p.proj).toFixed(1)}" y1="${padT}" x2="${X(p.proj).toFixed(1)}" y2="${H - padB}" stroke="var(--rec)" stroke-width="1.5" stroke-dasharray="2 2.5"/>` +
    `<text x="${X(p.proj).toFixed(1)}" y="${padT - 3}" text-anchor="middle" font-size="9" font-weight="700" fill="var(--ink)">proj ${f1(p.proj)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Projected points distribution for ${esc(p.name)}">
    <line x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}" stroke="var(--line)"/>
    ${ticks}<path d="${dc}" fill="var(--rec-soft)"/><path d="${d}" fill="none" stroke="var(--rec)" stroke-width="2"/>${proj}
  </svg>`;
}
function expandBody(p) {
  const lines = (p.lines ?? []).map((l) =>
    l.rungs === 0
      ? `<span class="linechip miss">no ${STAT_NAME[l.stat] ?? l.stat} line</span>`
      : `<span class="linechip"><b>${l.rungs}</b> ${STAT_NAME[l.stat] ?? l.stat} rung${l.rungs > 1 ? 's' : ''}${l.twoSided ? '' : ' *'}</span>`).join('');
  const oddsAt = p.oddsAt ? new Date(p.oddsAt).toLocaleString('en-GB', { weekday: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/London' }).replace(',', '') : '';
  return `<div class="lexp" hidden>
    ${miniCurve(p)}
    ${qStrip(p.quantiles, 'Chance of scoring at least')}
    <div class="linesrow">${lines}${p.ladder >= 3 ? `<span class="linechip"><b>${p.ladder}</b>-rung ladder — shape measured</span>` : '<span class="linechip miss">no ladder — shape assumed</span>'}</div>
    <div class="src">${p.books} books · odds pulled ${oddsAt} · * = over-only line, margin assumed</div>
  </div>`;
}

function decisionCard(dec, open) {
  const tight = dec.verdict === 'close_call';
  const verdict = dec.verdict === 'suppressed'
    ? '<span class="pill clear">MARGINAL — either fine</span>'
    : tight
      ? '<span class="pill tight">TIGHT — YOUR CALL</span>'
      : `<span class="pill good">Start ${esc(shortName(dec.rec.name))}</span>`;
  const eyebrow = dec.isChange ? 'SUGGESTED SWAP · ' : '';
  const fmax = Math.max(dec.rec.ceil, dec.alt.ceil) * 1.06;
  const duelist = (s, cls) => `<div class="duelist ${cls}">
    <div class="d-top"><span class="sw"></span><span class="nm">${esc(s.name)}</span>${injBadge(s.injury)}
      ${s.ladder >= 3 ? `<span class="ladnote ok">${s.ladder}-rung ladder</span>` : '<span class="ladnote warn">no ladder</span>'}
      <span class="meta">${esc(s.pos)} · ${esc(s.team)} v ${esc(s.opp)} · ${koLabel(s.ko)}</span>
      <span class="pj">${f1(s.proj)}<small> PROJ</small></span></div>
    <div class="frange">
      <span class="fv">floor <b>${f1(s.floor)}</b></span>
      <span class="ftrack"><span class="band" style="left:${(s.floor / fmax * 100).toFixed(1)}%;width:${((s.ceil - s.floor) / fmax * 100).toFixed(1)}%"></span><span class="dot" style="left:${(s.proj / fmax * 100).toFixed(1)}%"></span></span>
      <span class="cv">ceiling <b>${f1(s.ceil)}</b></span>
    </div></div>`;
  const chips = [...new Set([...dec.rec.chips, ...dec.alt.chips])]
    .map((c) => `<span class="chip${/Stacked|Same game/.test(c) ? ' stack' : ''}">${esc(c)}</span>`).join('');
  const pRec = 100 - dec.pOutscores;
  const qgrid = `<div class="qcap">Chance of scoring at least (pts)</div><div class="qtiles">
    ${dec.rec.quantiles.map(([p, v], i) => `<div class="qt"><span class="qp">${p}% ≥</span>
      <span class="qrow"><span class="sw" style="background:var(--rec)"></span>${f1(v)}</span>
      <span class="qrow"><span class="sw" style="background:var(--alt)"></span>${f1(dec.alt.quantiles[i][1])}</span></div>`).join('')}
  </div>`;
  let lock = '';
  if (dec.rec.ko && dec.alt.ko && Math.abs(new Date(dec.rec.ko) - new Date(dec.alt.ko)) > 12 * 3600e3) {
    const [early, late] = new Date(dec.rec.ko) < new Date(dec.alt.ko) ? [dec.rec, dec.alt] : [dec.alt, dec.rec];
    lock = `<div class="locknote"><span class="ic">⏱</span><span><b>${esc(shortName(early.name))} locks ${koLabel(early.ko)}</b> · ${esc(shortName(late.name))} open until ${koLabel(late.ko)}</span></div>`;
  }
  return `<article class="dec ${tight ? 'is-tight' : ''}${dec.isChange ? ' is-change' : ''}">
    <div class="dec-head"><span class="slot">${eyebrow}${esc(dec.pos)} SPOT</span><span class="dec-verdict">${verdict}</span></div>
    <div class="duel">${duelist(dec.rec, 'rec')}${duelist(dec.alt, 'altp')}</div>
    <figure class="curves"><figcaption>How their weeks could go — taller = more likely score</figcaption>${curveSvg(dec)}</figure>
    ${qgrid}
    <div class="simbar"><div class="l">Who outscores whom, across 12,000 simulated weeks</div>
      <div class="bar"><span class="seg r" style="flex:${pRec}">${esc(shortName(dec.rec.name))} ${pRec}%</span><span class="seg a" style="flex:${dec.pOutscores}">${dec.pOutscores}% ${esc(shortName(dec.alt.name))}</span></div></div>
    <div class="takeaway">${takeaway(dec)}</div>
    ${lock}
    <div class="xchips">${chips}</div>
    <div class="stats"><span>Gap <b>${f1(dec.gap)} pts</b></span>
      <span>Win prob swing <b>${dec.swingPp > 0 ? '+' : ''}${f1(dec.swingPp)}pp</b></span>
      ${(Math.abs(dec.rec.stackPct) > 2 || Math.abs(dec.alt.stackPct) > 2) ? `<span>Stack spread <b>+${f1(Math.max(dec.rec.stackPct, dec.alt.stackPct))}%</b></span>` : ''}</div>
    <details class="why"${open ? ' open' : ''}><summary>Full reasoning</summary>
      <div class="expl">${esc(dec.explanation)}</div>
      <div class="pc">
        <div><div class="h r">${esc(shortName(dec.rec.name))}</div><ul>${dec.rec.pros.map((p) => `<li>${esc(p)}</li>`).join('')}</ul></div>
        <div><div class="h a">${esc(shortName(dec.alt.name))}</div><ul>${dec.alt.pros.map((p) => `<li>${esc(p)}</li>`).join('')}</ul></div>
      </div>
    </details>
  </article>`;
}

const gate = document.getElementById('gate');
const gateForm = document.getElementById('gateForm');
const gateErr = document.getElementById('gateErr');
const gateGo = document.getElementById('gateGo');
const unameEl = document.getElementById('uname');
const statusEl = document.getElementById('gateStatus');
const statusText = document.getElementById('gateStatusText');
const gateFoot = document.getElementById('gateFoot');

// Storage is a convenience, never the source of truth: it throws outright in
// private browsing and inside data: URLs. State lives in memory; storage is
// written through where it works so a reopen skips the setup.
const store = {
  get(k) { try { return localStorage.getItem('sharp.' + k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem('sharp.' + k, v); } catch {} },
  del(k) { try { localStorage.removeItem('sharp.' + k); } catch {} },
};
const state = {
  user: store.get('user'),
  userId: store.get('userId'),
  leagues: (store.get('leagues') || '').split(',').filter(Boolean),
};
// A rebuild invalidates every cached simulation.
const VERSION = (DATA.sharpRefreshedAt ?? DATA.pulledAt) + '|' + DATA.week;

const say = (t) => { statusEl.hidden = false; statusText.textContent = t; };
const fail = (t) => { gateErr.hidden = false; gateErr.textContent = t; statusEl.hidden = true; gateGo.disabled = false; };

gateFoot.innerHTML = 'Lines from Pinnacle and The Odds API · week ' + DATA.week +
  ', updated ' + pulled.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' }) +
  '.<br>Your username is stored only on this device.';

const BAKED = DATA.baked || null;
// This page can only read Sleeper when it is served from its own address.
// Inside claude.ai it runs in a sandbox that blocks outbound requests, so a
// network failure there is expected rather than the viewer's fault.
const SANDBOXED = location.hostname.endsWith('claude.ai') || location.protocol === 'data:';

function readableError(e) {
  const m = String(e && e.message || e);
  if (m === 'not_found') return 'No Sleeper user with that username. Check the spelling — it is your username, not your display name.';
  if (m === 'no_roster') return 'That league exists but you do not own a team in it.';
  if (m === 'no_matchup') return 'No matchup posted for this week in that league yet.';
  if (/Failed to fetch|NetworkError/i.test(m)) {
    return SANDBOXED
      ? 'This copy is running inside claude.ai, which blocks it from reading Sleeper. It can only show the leagues built into it' +
        (BAKED ? ` (${BAKED.user}'s).` : '.') + ' Ask for the hosted link to use your own.'
      : 'Could not reach Sleeper. Check your connection and try again.';
  }
  return 'Something went wrong: ' + m;
}

async function run(username, opts = {}) {
  gateErr.hidden = true;
  gateGo.disabled = true;

  // Baked reports need no network and no simulation — use them whenever they
  // are the ones being asked for.
  if (BAKED && !opts.pick && username.toLowerCase() === BAKED.user.toLowerCase()) {
    state.user = BAKED.user;
    store.set('user', BAKED.user);
    paintAcct();
    renderAll(BAKED.leagues);
    gate.hidden = true;
    document.getElementById('deck').hidden = false;
    statusEl.hidden = true;
    gateGo.disabled = false;
    requestAnimationFrame(() => document.getElementById('deck').dispatchEvent(new Event('scroll')));
    return;
  }

  let userId = state.userId, leagues = opts.leagues;
  if (!leagues) {
    say('Finding your leagues…');
    try {
      ({ userId, leagues } = await Sharp.findLeagues(username));
    } catch (e) { return fail(readableError(e)); }
    if (!leagues.length) return fail(`${username} has no NFL leagues for this season.`);
  }

  state.user = username; state.userId = userId;
  store.set('user', username);
  store.set('userId', userId);
  paintAcct();

  // More than one league: let them choose which to follow (remembered).
  let chosen = state.leagues.filter((id) => leagues.some((l) => l.id === id));
  if (opts.pick || (!chosen.length && leagues.length > 1)) {
    statusEl.hidden = true;
    gateGo.disabled = false;
    return showPicker(username, leagues, chosen);
  }
  if (!chosen.length) chosen = leagues.map((l) => l.id);

  const built = [];
  const deckEl = document.getElementById('deck');
  const show = () => {
    // Keep the reader where they are while later leagues arrive behind them.
    const at = deckEl.clientWidth ? Math.round(deckEl.scrollLeft / deckEl.clientWidth) : 0;
    renderAll(built);
    gate.hidden = true;
    deckEl.hidden = false;
    requestAnimationFrame(() => {
      if (at) deckEl.scrollLeft = at * deckEl.clientWidth;
      deckEl.dispatchEvent(new Event('scroll'));
    });
  };

  for (let i = 0; i < chosen.length; i++) {
    const lg = leagues.find((l) => l.id === chosen[i]);
    say(`Simulating ${lg ? lg.name : 'league'} (${i + 1} of ${chosen.length})…`);
    // Yield so the status text paints before the simulation blocks the thread.
    await new Promise((r) => setTimeout(r, 16));
    const cacheKey = 'rep.' + VERSION + '.' + chosen[i];
    const cached = store.get(cacheKey);
    if (cached) {
      try { built.push(JSON.parse(cached)); if (built.length === 1) show(); continue; } catch {}
    }
    try {
      const m = await Sharp.resolveMatchup(userId, chosen[i], DATA.week, DATA);
      const rep = Sharp.buildLeagueReport(m, DATA, {
        simIterations: 20000, decisionIterations: 12000, maxDecisions: 10,
      });
      built.push(rep);
      store.set(cacheKey, JSON.stringify(rep));
      // First league up as soon as it exists; the rest fill in behind it.
      if (built.length === 1) show();
    } catch (e) {
      // One bad league should not sink the rest.
      console.warn('league failed', chosen[i], e);
      if (chosen.length === 1) return fail(readableError(e));
    }
  }
  if (!built.length) return fail('None of your leagues could be simulated this week.');
  show();
  statusEl.hidden = true;
  gateGo.disabled = false;
}

function showPicker(username, leagues, chosen) {
  const picked = new Set(chosen.length ? chosen : leagues.map((l) => l.id));
  gateForm.hidden = true;
  const wrap = document.createElement('div');
  wrap.className = 'gate-pick';
  wrap.innerHTML = `<div class="gate-l">Which leagues?</div>` +
    leagues.map((l, i) => `<div class="pickrow">
      <input type="checkbox" id="lg${i}" value="${esc(l.id)}"${picked.has(l.id) ? ' checked' : ''}>
      <label for="lg${i}">${esc(l.name)}</label></div>`).join('') +
    `<button class="gate-b" id="pickGo">Continue</button>`;
  gateForm.insertAdjacentElement('afterend', wrap);
  wrap.querySelector('#pickGo').addEventListener('click', () => {
    const ids = [...wrap.querySelectorAll('input:checked')].map((el) => el.value);
    if (!ids.length) return;
    state.leagues = ids;
    store.set('leagues', ids.join(','));
    wrap.remove();
    gateForm.hidden = false;
    run(username, { leagues });
  });
}

gateForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const v = unameEl.value.trim();
  if (!v) return fail('Enter your Sleeper username.');
  run(v);
});

// ?u=<username> lets you bookmark straight to your own leagues.
// Header account row: who this is, and a way out.
const acctRow = document.createElement('div');
acctRow.className = 'acct';
acctRow.innerHTML = '<span id="acctWho"></span>';
{
  const b1 = document.createElement('button'); b1.textContent = 'leagues';
  b1.addEventListener('click', () => { if (state.user) { gate.hidden = false; document.getElementById('deck').hidden = true; run(state.user, { pick: true }); } });
  const b2 = document.createElement('button'); b2.textContent = 'sign out';
  b2.addEventListener('click', () => {
    for (const k of ['user', 'userId', 'leagues']) store.del(k);
    location.href = location.pathname;
  });
  acctRow.append(b1, b2);
  document.querySelector('.top').appendChild(acctRow);
}
function paintAcct() {
  document.getElementById('acctWho').textContent = state.user ? '@' + state.user : '';
  acctRow.style.display = state.user ? 'flex' : 'none';
}
paintAcct();

// Inside the sandbox there is nothing to type — say so instead of offering a
// field that cannot work.
if (SANDBOXED && BAKED) {
  gateForm.hidden = true;
  document.getElementById('gateBlurb').textContent =
    `Showing ${BAKED.user}'s leagues. This copy runs inside claude.ai and can't read Sleeper directly — the hosted version lets anyone use their own username.`;
}

// ?u=<username> lets you bookmark straight to your own leagues.
const params = new URLSearchParams(location.search);
const saved = params.get('u') || state.user || (SANDBOXED && BAKED ? BAKED.user : null);
if (saved) {
  unameEl.value = saved;
  if (!SANDBOXED) document.getElementById('gateBlurb').textContent =
    'Reading your Sleeper leagues and simulating this week from the latest betting lines.';
  run(saved);
}
</script>

</body>
</html>
